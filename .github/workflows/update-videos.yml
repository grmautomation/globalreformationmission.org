name: Update Videos from YouTube

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update-videos:
    permissions:
      contents: write
      actions: write   # required to dispatch deploy.yml (GITHUB_TOKEN pushes don't trigger other workflows)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest videos from YouTube API
        run: node scripts/fetch-latest-videos.mjs

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet client/src/lib/siteData.ts && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if updated
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "GRM Automation"
          git config user.email "automation@globalreformation.org"
          git add client/src/lib/siteData.ts
          git commit -m "Auto-update videos from YouTube API"
          git push

      - name: Trigger deploy
        if: steps.git-check.outputs.changed == 'true'
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
